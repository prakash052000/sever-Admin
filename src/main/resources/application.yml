server:
  port: 8081

spring:
  application:
    name: ServerAdmin
  boot:
    admin:
      ui:
        title: "ServerAdmin Dashboard"
      discovery:
        converter:
          management-context-path: /actuator
  security:
    user:
      name: admin
      password: admin

info:
  app:
    name: ServerAdmin
    type: monitoring
    port: 8081

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    hostname: localhost
    prefer-ip-address: false
    instance-id: ServerAdmin:8081
    metadata-map:
      unique-name: ServerAdmin
      service-type: monitoring
      port: 8081

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
    info:
      enabled: true
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
  metrics:
    tags:
      application: ServerAdmin
